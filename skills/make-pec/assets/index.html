<script>
'use strict';
const $ = selector => document.querySelector(selector);
const types = {page:'页面',module:'模块',action:'动作',task:'后台任务'};
const labels = {layout:'布局',ui:'UI 与交互',data:'数据'};
let nodes = [], byId = new Map(), selected = null, toastTimer;
function el(tag, text, className) {
  const result = document.createElement(tag);
  if (text !== undefined) result.textContent = text;
  if (className) result.className = className;
  return result;
}
function notify(message) {
  $('#toast').textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').textContent = ''; }, 4000);
}
function metadata(source) {
  const result = {};
  for (const line of source.split('\n')) {
    const match = line.match(/^\s*(?:[-*]\s+)?(?:\*\*)?(id|type|title|route)(?:\*\*)?\s*[:：]\s*(.*?)\s*$/);
    if (match) {
      let value = match[2].replace(/^(?:\*\*)\s*/, '');
      if (/^".*"$/.test(value)) { try { value = JSON.parse(value); } catch { value = value.slice(1,-1); } }
      else if (/^'.*'$/.test(value)) value = value.slice(1,-1).replace(/''/g,"'");
      else value = value.replace(/^`(.*)`$/, '$1');
      result[match[1]] = value;
    }
  }
  return result;
}
function unitTitle(key, text) {
  return labels[key] || text.match(/^#\s+(.+)$/m)?.[1] || key.replace(/^logic\//,'');
}
async function loadFiles(fileList) {
  const files = new Map();
  for (const file of fileList) {
    const path = file.webkitRelativePath.split('/').slice(1).join('/');
    if (/^(pages|tasks)\/.+\.md$/.test(path)) files.set(path, file);
  }
  const next = [];
  for (const [path,file] of files) {
    if (!path.endsWith('/_node.md')) continue;
    const meta = metadata(await file.text());
    if (!meta.id || !meta.title || !types[meta.type]) throw new Error(`${path} 需要 id、type 和 title。`);
    const dir = path.slice(0,-9);
    const units = [];
    for (const [unitPath,unitFile] of files) {
      if (!unitPath.startsWith(dir + '/')) continue;
      const relative = unitPath.slice(dir.length + 1);
      if (!/^(layout|ui|data|logic\/[^/]+)\.md$/.test(relative)) continue;
      const key = relative.slice(0,-3), text = await unitFile.text();
      units.push({key,text,title:unitTitle(key,text)});
    }
    const rank = key => key === 'layout' ? 0 : key === 'ui' ? 1 : key.startsWith('logic/') ? 2 : 3;
    units.sort((a,b) => rank(a.key)-rank(b.key) || a.key.localeCompare(b.key));
    next.push({...meta,dir,units,children:[]});
  }
  if (!next.length) throw new Error('没有找到 PEC 节点，请选择直接包含 pages/ 或 tasks/ 的文件夹。');
  const nextById = new Map();
  for (const node of next) {
    if (nextById.has(node.id)) throw new Error(`节点 ID 重复：${node.id}`);
    nextById.set(node.id,node);
    node.parent = next.filter(parent => node.dir.startsWith(parent.dir + '/')).sort((a,b) => b.dir.length-a.dir.length)[0];
    if (node.parent) node.parent.children.push(node);
  }
  nodes = next; byId = nextById;
  $('#folder-name').textContent = `${fileList[0].webkitRelativePath.split('/')[0]} · ${nodes.length} 个节点`;
  $('#search').disabled = false; $('#search').value = '';
  renderTree();
  if (!navigateHash()) openNode(nodes.find(n => !n.parent).id);
}
function renderTree() {
  const tree = $('#tree'); tree.replaceChildren();
  const query = $('#search').value.trim().toLocaleLowerCase();
  const matches = node => node.title.toLocaleLowerCase().includes(query) || node.children.some(matches);
  function branch(items) {
    const list = el('ul');
    for (const node of items.filter(matches)) {
      const item = el('li'), button = el('button',undefined,'node-link');
      button.append(el('span',types[node.type],'node-kind'),document.createTextNode(node.title));
      button.dataset.node = node.id;
      if (node.id === selected) button.setAttribute('aria-current','page');
      button.addEventListener('click',() => openNode(node.id));
      if (node.children.length) {
        const details = el('details'), summary = el('summary'); details.open = true;
        summary.append(button); details.append(summary,branch(node.children)); item.append(details);
      } else { button.classList.add('leaf'); item.append(button); }
      list.append(item);
    }
    return list;
  }
  for (const [root,title] of [['pages/','页面'],['tasks/','后台任务']]) {
    const items = nodes.filter(n => !n.parent && n.dir.startsWith(root));
    if (!items.length) continue;
    tree.append(el('p',title,'nav-heading'),branch(items));
  }
  if (!nodes.some(matches)) tree.append(el('p','没有匹配的节点','empty-nav'));
}
function targetFor(kind,target) {
  if (kind === 'n') return byId.has(target) ? {id:target} : null;
  const slash = target.indexOf('/'), id = target.slice(0,slash), key = target.slice(slash+1);
  return slash > 0 && byId.get(id)?.units.some(unit => unit.key === key) ? {id,key} : null;
}
function hashFor(id,key) { return '#' + encodeURIComponent(id) + (key ? '/' + encodeURIComponent(key) : ''); }
async function copyReference(text) {
  try { await navigator.clipboard.writeText(text); notify('已复制引用'); }
  catch {
    const field = el('textarea'); field.value = text; field.style.cssText = 'position:fixed;opacity:0'; document.body.append(field); field.select();
    const copied = document.execCommand('copy'); field.remove();
    notify(copied ? '已复制引用' : '复制失败，请选中正文中的引用手动复制。');
  }
}
function reference(kind,target) {
  const text = `$${kind}:${target}`;
  if (kind === 'c' || kind === 'd') {
    const button = el('button',text,'ref'); button.title = '复制引用';
    button.addEventListener('click',() => copyReference(text)); return button;
  }
  const destination = targetFor(kind,target);
  if (!destination) { const span = el('span',text,'ref missing'); span.title = '未找到引用目标'; return span; }
  const link = el('a',text,'ref'); link.href = hashFor(destination.id,destination.key);
  link.addEventListener('click',event => { event.preventDefault(); openNode(destination.id,destination.key); });
  return link;
}
function renderMarkdown(text,refs) {
  const block = el('div',undefined,'markdown');
  block.innerHTML = DOMPurify.sanitize(marked.parse(text), {FORBID_TAGS:['style','input','button','textarea','form']});
  const walker = document.createTreeWalker(block,NodeFilter.SHOW_TEXT), texts = [];
  while (walker.nextNode()) if (!walker.currentNode.parentElement.closest('pre,a')) texts.push(walker.currentNode);
  for (const node of texts) {
    const pattern = /\$([nkcd]):([\p{L}\p{N}_./#:@%+~\[\]-]+)/gu;
    let match, offset = 0; const fragment = document.createDocumentFragment();
    while ((match = pattern.exec(node.textContent))) {
      const target = match[2].replace(/[.,;:]+$/,'');
      fragment.append(document.createTextNode(node.textContent.slice(offset,match.index)),reference(match[1],target));
      refs.set(`$${match[1]}:${target}`,{kind:match[1],target});
      offset = match.index + 3 + target.length;
    }
    if (offset) { fragment.append(document.createTextNode(node.textContent.slice(offset))); node.replaceWith(fragment); }
  }
  for (const link of block.querySelectorAll('a:not(.ref)')) {
    const href = link.getAttribute('href') || '';
    if (/^https?:\/\//i.test(href)) { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
    else { link.removeAttribute('href'); link.title = href; }
  }
  return block;
}
function openNode(id,key,updateHash = true) {
  const node = byId.get(id); if (!node) return false;
  selected = id;
  if (updateHash) history.pushState(null,'',hashFor(id,key));
  document.title = `${node.title} · PEC`;
  for (const button of document.querySelectorAll('[data-node]')) {
    if (button.dataset.node === id) {
      button.setAttribute('aria-current','page');
      let ancestor = button.parentElement;
      while (ancestor) { if (ancestor.tagName === 'DETAILS') ancestor.open = true; ancestor = ancestor.parentElement; }
    } else button.removeAttribute('aria-current');
  }
  const content = $('#content'), outline = $('#outline'), refs = new Map(); content.replaceChildren(); outline.replaceChildren(el('h2','本页目录'));
  const ancestors = []; for (let parent = node.parent; parent; parent = parent.parent) ancestors.unshift(parent.title);
  content.append(el('div',[node.dir.startsWith('tasks/') ? '后台任务' : '页面',...ancestors].join(' / '),'breadcrumb'),el('h1',node.title));
  const meta = el('div',undefined,'meta'); meta.append(el('span',types[node.type],'badge'),el('span',node.id));
  if (node.route) meta.append(el('code',node.route)); content.append(meta);
  for (const unit of node.units) {
    const section = el('section',undefined,'unit'); section.id = 'unit-' + unit.key;
    section.append(el('div',unit.key + '.md','unit-label'));
    if (!/^#\s+/m.test(unit.text)) section.append(el('h2',unit.title));
    section.append(renderMarkdown(unit.text,refs)); content.append(section);
    const anchor = el('a',unit.title); anchor.href = hashFor(id,unit.key);
    anchor.addEventListener('click',event => { event.preventDefault(); openNode(id,unit.key); }); outline.append(anchor);
  }
  if (!node.units.length) content.append(el('p','此节点暂无知识单元。可从左侧继续浏览子节点。','note'));
  if (refs.size) { outline.append(el('h2','关联引用','refs-title')); for (const ref of refs.values()) outline.append(reference(ref.kind,ref.target)); }
  if (key) document.getElementById('unit-' + key)?.scrollIntoView({block:'start'});
  else window.scrollTo({top:0});
  return true;
}
function navigateHash() {
  try { const [id,key] = location.hash.slice(1).split('/').map(decodeURIComponent); return openNode(id,key,false); }
  catch { return false; }
}
document.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click',() => $('#folder-input').click()));
$('#folder-input').addEventListener('change',async event => {
  const files = Array.from(event.target.files); if (!files.length) return;
  try { await loadFiles(files); } catch (error) { notify(error.message); }
  event.target.value = '';
});
$('#search').addEventListener('input',renderTree);
window.addEventListener('popstate',navigateHash);
</script>
